# Härtung der Testinstanz: die üblichen Brute-Force-Ziele abschalten.
# Öffentlich bleiben Feeds, Stellenseiten und Mediendateien - also das, was der
# Empfehlungsbund-Validator tatsächlich abrufen muss.

<Files "xmlrpc.php">
    Require all denied
</Files>

<Files "wp-cron.php">
    Require all denied
</Files>

# Suchmaschinen sollen die Instanz gar nicht erst indizieren.
<IfModule mod_headers.c>
    Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>
